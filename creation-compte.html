<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte</title>
</head>
<body>
    <button id="btnRetour">Retour</button>
    <h1>Créer un compte</h1>
    <form id="formCreation">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <br>
        <button type="submit">Créer mon compte</button>
    </form>

    <div id="divResultat" hidden>
        <p>Compte créé ! Voici votre mot de passe :</p>
        <p><strong id="motDePasse"></strong></p>
        <button id="btnVersConnexion">Se connecter</button>
    </div>

    <script src="creation-compte.js"></script>
</body>
</html>
